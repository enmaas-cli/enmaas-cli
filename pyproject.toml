[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enmaas-cli"
version = "0.1.0"
description = "Delegate work to EnMaaS-hosted models from the command line"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "jsonschema>=4.18,<5"]

[project.scripts]
enmaas = "enmaas_cli.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "types-jsonschema"]

[tool.hatch.build.targets.wheel]
packages = ["src/enmaas_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: hits the real EnMaaS gateway (deselect with '-m \"not live\"')"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]
