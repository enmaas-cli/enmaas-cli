[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enmaas-cli"
version = "0.7.0"
description = "Delegate bulk and one-shot model work to the EnMaaS gateway; answers go to files"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "eparenti", email = "eparenti@redhat.com" }]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "jsonschema>=4.18,<5"]
keywords = ["llm", "cli", "delegation", "claude-code", "codex", "enmaas"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/enmaas-cli/enmaas-cli"
Documentation = "https://github.com/enmaas-cli/enmaas-cli/blob/main/INSTALL.md"
Changelog = "https://github.com/enmaas-cli/enmaas-cli/blob/main/CHANGELOG.md"
Issues = "https://github.com/enmaas-cli/enmaas-cli/issues"

[project.scripts]
enmaas = "enmaas_cli.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "types-jsonschema"]

[tool.hatch.build.targets.wheel]
packages = ["src/enmaas_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: hits the real EnMaaS gateway (deselect with '-m \"not live\"')"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]
